    function SearchableConsigneeSelect({ value, onChange, options = [], onAddNew }) {
      const [isOpen, setIsOpen] = useState(false);
      const [search, setSearch] = useState('');

        function handleClickOutside(e) {
          if (dropdownRef.current && !dropdownRef.current.contains(e.target)) {
            setIsOpen(false);
          }
        }
        document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, []);

      const filteredOptions = options.filter(c => {
        if (!search) return true;
        const q = search.toLowerCase();
        return (
          (c.name || '').toLowerCase().includes(q) ||
          (c.country || '').toLowerCase().includes(q) ||
          (c.address || '').toLowerCase().includes(q)
        );
      });

      const selectedConsignee = options.find(c => c.name === value || `${c.name} (${c.country})` === value);

      return (
        <div className="relative w-full" ref={dropdownRef}>
          <div className="flex space-x-1">
            <button
              type="button"
              onClick={() => setIsOpen(!isOpen)}
              className="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-xs font-semibold flex items-center justify-between text-left hover:border-indigo-500 focus:outline-none shadow-xs transition-colors cursor-pointer"

    function SearchableComboboxSelect({
      value,
      onChange,
      options = [],
      placeholder = "-- Search / Select --",
      searchPlaceholder = "Search options...",
      onAddNew = null,
      addNewLabel = "Add New Master Entry"
    }) {
      const [isOpen, setIsOpen] = useState(false);
      const [search, setSearch] = useState('');
      const dropdownRef = React.useRef(null);

      React.useEffect(() => {
        function handleClickOutside(e) {
          if (dropdownRef.current && !dropdownRef.current.contains(e.target)) {
            setIsOpen(false);
          }
        }
        document.addEventListener('mousedown', handleClickOutside);
        return () => document.removeEventListener('mousedown', handleClickOutside);
      }, []);

      const normalizedOptions = options.map((item, idx) => {
        if (typeof item === 'string') {
          return { id: `opt-${idx}`, label: item, value: item, subtext: '', badge: '' };
        }
        if (item && typeof item === 'object') {
          const labelStr = item.label || item.name || item.title || item.code || item.bankName || String(item);
          const valStr = item.value !== undefined ? item.value : (item.code || item.name || item.title || item.label || String(item));
          const subStr = item.subtext !== undefined ? item.subtext : (item.address || item.description || item.accountNo || item.category || (item.hsn ? `HSN: ${item.hsn} | Rate: $${item.price || item.unitCost || 0}` : ''));
          const badgeStr = item.badge !== undefined ? item.badge : (item.country || item.code || item.type || item.currency || '');
          return { id: item.id || `opt-${idx}`, label: labelStr, value: valStr, subtext: subStr, badge: badgeStr, raw: item };
        }
        return { id: `opt-${idx}`, label: String(item), value: String(item), subtext: '', badge: '' };
      });

      const filteredOptions = normalizedOptions.filter(item => {
        if (!search) return true;
        const q = search.toLowerCase();
        return (
          (item.label || '').toLowerCase().includes(q) ||
          (item.value || '').toLowerCase().includes(q) ||
          (item.subtext || '').toLowerCase().includes(q) ||
          (item.badge || '').toLowerCase().includes(q)
        );
      });

        <div className="relative w-full" ref={dropdownRef}>

            <div className="absolute left-0 right-0 top-11 bg-white rounded-xl shadow-2xl border border-slate-200 z-[250] p-2.5 space-y-2 animate-fadeIn max-h-72 flex flex-col">
              <div className="relative shrink-0">
                <input

                  placeholder={searchPlaceholder}
                  value={search}

                <i className="fi fi-rr-search text-slate-400 absolute left-2.5 top-2.5 text-xs"></i>

              <div className="overflow-y-auto flex-1 space-y-1 pr-0.5 scrollbar-thin">
                {filteredOptions.length === 0 ? (

                    No matching options found
                  </div>
                ) : (
                  filteredOptions.map((opt) => {
                    const isSelected = value === opt.value || value === opt.label;
                    return (
                      <div
                        key={opt.id}
                        onClick={() => {
                          onChange(opt.value, opt.raw);
                          setIsOpen(false);
                          setSearch('');

                        className={`p-2 rounded-lg cursor-pointer transition-all flex items-center justify-between text-xs ${isSelected ? 'bg-indigo-50 border border-indigo-200 text-indigo-900 font-bold' : 'hover:bg-slate-100 text-slate-700'

                          )}
                        </div>
                        {isSelected && <i className="fi fi-rr-check text-xs text-indigo-600 shrink-0 ml-1"></i>}
                      </div>
                    );
                  })
                )}
              </div>

              {onAddNew && (

                    type="button"
                    onClick={() => {

                  >

                    <span>{addNewLabel}</span>
                  </button>
                </div>
              )}
            </div>
          )}
        </div>

      const handleExecuteCsvImport = () => {
        if (!csvFileRawText) return alert('Please select a valid CSV file to import.');
        const lines = csvFileRawText.split(/\r?\n/).filter(line => line.trim().length > 0);
        if (lines.length <= 1) return alert('CSV file is empty or missing data rows.');

        const parseCsvLine = (text) => {
          const result = [];
          let cur = '';
          let inQuotes = false;
          for (let i = 0; i < text.length; i++) {
            const char = text[i];
            if (char === '"') {
              inQuotes = !inQuotes;
            } else if (char === ',' && !inQuotes) {
              result.push(cur.trim().replace(/^"|"$/g, ''));
              cur = '';
            } else {
              cur += char;
            }
          }
          result.push(cur.trim().replace(/^"|"$/g, ''));
          return result;
        };

        const headers = parseCsvLine(lines[0]).map(h => h.toLowerCase().trim());
        let updatedCount = 0;
        let createdCount = 0;
        let skippedCount = 0;

        let currentMaster = [...masterProductsSettings];

        for (let i = 1; i < lines.length; i++) {
          const cols = parseCsvLine(lines[i]);
          if (cols.length < 2) continue;

          const rowObj = {};
          headers.forEach((h, idx) => {
            rowObj[h] = cols[idx] || '';
          });

          const pName = rowObj.product_name || rowObj.name || cols[0];
          const pHsn = rowObj.hsn_sac || rowObj.hsn || cols[1];
          if (!pName || !pHsn) continue;

          const newProd = {
            id: `PROD-CSV-${Math.floor(1000 + Math.random() * 9000)}`,
            name: pName,
            sku: rowObj.sku || `SKU-${pHsn}`,
            hsn: pHsn,
            gstRate: rowObj.gst_rate || '18',
            imgUrl: rowObj.image_url || '',
            description: rowObj.product_description || '',
            inventoryType: rowObj.inventory_type || 'Finished Goods',
            productTag: rowObj.product_tag || '',
            unit: rowObj.unit || 'Box',
            netWeightKg: parseFloat(rowObj.net_weight_kg) || 0,
            grossWeightKg: parseFloat(rowObj.gross_weight_kg) || 0,
            dimensionM3: parseFloat(rowObj.dimension_m3) || 0,
            sellPriceInr: parseFloat(rowObj.sell_price_inr) || 0,
            schemeType: rowObj.scheme_type || 'RoDTEP',
            schemeUnit: rowObj.scheme_unit || 'KG',
            schemePercentage: parseFloat(rowObj.scheme_percentage) || 0,
            schemeCapValue: parseFloat(rowObj.scheme_cap_value) || 0,
            status: 'Active'
          };

          const existingIdx = currentMaster.findIndex(m => (m.name || '').toLowerCase() === pName.toLowerCase() || m.hsn === pHsn);

          if (existingIdx >= 0) {
            if (csvConflictStrategy === 'update') {
              currentMaster[existingIdx] = { ...currentMaster[existingIdx], ...newProd, id: currentMaster[existingIdx].id };
              updatedCount++;
            } else if (csvConflictStrategy === 'skip') {
              skippedCount++;
            } else if (csvConflictStrategy === 'variant') {
              newProd.name = `${newProd.name} (Variant)`;
              currentMaster.unshift(newProd);
              createdCount++;
            }
          } else {
            currentMaster.unshift(newProd);
            createdCount++;
          }
        }

        setMasterProductsSettings(currentMaster);
        setMasterProducts(currentMaster);

      const generateCloudinarySignature = async (params, secret, algo = 'SHA-1') => {
        const sortedKeys = Object.keys(params).sort();
        const stringToSign = sortedKeys.map(k => `${k}=${params[k]}`).join('&') + secret;
        const encoder = new TextEncoder();
        const data = encoder.encode(stringToSign);
        const hashBuffer = await crypto.subtle.digest(algo, data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
      };

        const l = parseFloat(length) || 0;
        const w = parseFloat(width) || 0;
        const h = parseFloat(height) || 0;
        if (l <= 0 || w <= 0 || h <= 0) return 0;
        
        let cbm = 0;
        if (unit === 'MM') {
          cbm = (l * w * h) / 1000000000;
        } else if (unit === 'INCH') {
          cbm = (l * w * h) * 0.000016387064;
        } else if (unit === 'M') {
          cbm = l * w * h;
        } else {
          // Default CM
          cbm = (l * w * h) / 1000000;
        }
        return parseFloat(cbm.toFixed(6));

        if (productObj.sellPriceUsd !== undefined && parseFloat(productObj.sellPriceUsd) > 0) {
          basePrice = parseFloat(productObj.sellPriceUsd);
        } else if (productObj.unitPriceUsd !== undefined && parseFloat(productObj.unitPriceUsd) > 0) {

        } else if (productObj.priceUsd !== undefined && parseFloat(productObj.priceUsd) > 0) {

        if (!num || isNaN(num)) return 'ZERO USD ONLY';
        const a = ['', 'ONE ', 'TWO ', 'THREE ', 'FOUR ', 'FIVE ', 'SIX ', 'SEVEN ', 'EIGHT ', 'NINE ', 'TEN ', 'ELEVEN ', 'TWELVE ', 'THIRTEEN ', 'FOURTEEN ', 'FIFTEEN ', 'SIXTEEN ', 'SEVENTEEN ', 'EIGHTEEN ', 'NINETEEN '];
        const b = ['', '', 'TWENTY ', 'THIRTY ', 'FORTY ', 'FIFTY ', 'SIXTY ', 'SEVENTY ', 'EIGHTY ', 'NINETY '];

        const inWords = (n) => {
          n = Math.floor(n).toString();
          if (n.length > 9) return 'OVERFLOW';
          const n_array = ('000000000' + n).substr(-9).match(/^(\d{2})(\d{2})(\d{2})(\d{1})(\d{2})$/);
          if (!n_array) return '';
          let str = '';
          str += (n_array[1] != 0) ? (a[Number(n_array[1])] || b[n_array[1][0]] + ' ' + a[n_array[1][1]]) + 'CRORE ' : '';
          str += (n_array[2] != 0) ? (a[Number(n_array[2])] || b[n_array[2][0]] + ' ' + a[n_array[2][1]]) + 'LAKH ' : '';
          str += (n_array[3] != 0) ? (a[Number(n_array[3])] || b[n_array[3][0]] + ' ' + a[n_array[3][1]]) + 'THOUSAND ' : '';
          str += (n_array[4] != 0) ? (a[Number(n_array[4])] || b[n_array[4][0]] + ' ' + a[n_array[4][1]]) + 'HUNDRED ' : '';
          str += (n_array[5] != 0) ? ((str != '') ? 'AND ' : '') + (a[Number(n_array[5])] || b[n_array[5][0]] + ' ' + a[n_array[5][1]]) : '';
          return str;
        };

        const words = inWords(num).trim();
        return (words ? words : 'ZERO') + ' USD ONLY';

          a.label === companyAddressVal || 
          a.address === companyAddressVal ||
          (a.label && companyAddressVal && companyAddressVal.includes(a.companyName)) ||
          (a.companyName && companyAddressVal && companyAddressVal.includes(a.companyName))
        );

        let prefix = 'EXIM';
        if (matchingAddr && matchingAddr.docPrefix) {
          prefix = matchingAddr.docPrefix;
        } else if (companyAddressVal) {
          const valLower = companyAddressVal.toLowerCase();
          if (valLower.includes('mglobal')) prefix = 'MGII';
          else if (valLower.includes('masterglobal')) prefix = 'MGMUM';
          else if (valLower.includes('greanscape') || valLower.includes('shakti')) prefix = 'GSV';
        }

        const now = new Date();
        const yyyy = now.getFullYear();
        const mm = String(now.getMonth() + 1).padStart(2, '0');

        let seqNum = 1;
        if (docType === 'quotation') {
          seqNum = (quotations || []).length + 1;
        } else if (docType === 'pi' || docType === 'proforma') {
          seqNum = (proformaInvoices || []).length + 1;

          seqNum = (blRecords || []).length + 1;
        } else if (docType === 'pkl') {
          seqNum = (packingLists || []).length + 1;

                          src={userFormData.avatar_cdn_url || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=100&q=80'}
                          alt="Avatar preview"
                          className="w-12 h-12 rounded-full border-2 border-indigo-500 object-cover shrink-0 shadow-xs"
                        />
                        <div className="flex-1 space-y-1.5">
                          <input
                            type="text"
                            placeholder="Avatar URL or CDN link..."
                            value={userFormData.avatar_cdn_url || ''}
                            onChange={e => setUserFormData({ ...userFormData, avatar_cdn_url: e.target.value })}
                            className="w-full border border-slate-300 rounded-xl px-3 py-1.5 text-xs font-mono font-bold"
                          />
                          <button
                            type="button"
                            onClick={() => { setDriveTargetContext('user_avatar'); setIsDrivePickerOpen(true); }}
                            className="px-3 py-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg text-[11px] flex items-center space-x-1 shadow-xs"
                          >
                            <i className="fi fi-rr-folder text-xs"></i>
                            <span>Choose from ShipzyDrive</span>
                          </button>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>

                {/* DRAWER FOOTER */}
                <div className="flex items-center justify-between px-6 py-4 bg-slate-50 border-t border-slate-200">
                  <button
                    type="button"
                    onClick={() => setIsUserDrawerOpen(false)}
                    className="px-5 py-2.5 bg-white border border-slate-300 hover:bg-slate-100 text-slate-700 font-extrabold rounded-xl text-xs transition-colors"
                  >
                    Cancel
                  </button>
                  <button
                    type="button"
                    onClick={handleSaveUserRecord}
                    className="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white font-extrabold rounded-xl text-xs flex items-center space-x-2 shadow-lg shadow-indigo-600/20 transition-all cursor-pointer"
                  >
                    <i className="fi fi-rr-disk text-xs"></i>
                    <span>Save & Provision User</span>
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* CSV BULK IMPORT MODAL (PRD SECTION 3) */}
          {isCsvImportModalOpen && (
            <div className="fixed inset-0 bg-slate-900/60 backdrop-blur-xs flex items-center justify-center z-[200] p-4">
              <div className="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-2xl overflow-hidden flex flex-col animate-fadeIn">
                {/* MODAL HEADER */}
                <div className="flex items-center justify-between px-6 py-4 border-b border-slate-200 bg-slate-50">
                  <div className="flex items-center space-x-2">
                    <span className="text-xl">📥</span>
                    <div>
                      <h3 className="text-base font-black text-slate-900">Import Products via CSV</h3>
                      <p className="text-[11px] text-slate-500 font-medium">Bulk import product catalog, HSN codes, logistics weights & incentive schemes</p>
                    </div>
                  </div>
                  <button onClick={() => setIsCsvImportModalOpen(false)} className="text-slate-400 hover:text-slate-800 text-xl font-bold p-1 cursor-pointer">✕</button>
                </div>

                <div className="p-6 space-y-6 text-xs text-slate-700 max-h-[75vh] overflow-y-auto">
                  {/* STEP 1: SELECT FILE */}
                  <div className="space-y-3">
                    <div className="flex items-center justify-between">
                      <span className="font-extrabold text-slate-900 text-xs uppercase tracking-wider flex items-center space-x-1.5">
                        <span className="w-5 h-5 rounded-full bg-indigo-600 text-white font-black flex items-center justify-center text-[10px]">1</span>
                        <span>STEP 1: SELECT FILE</span>
                      </span>
                      <button
                        type="button"
                        onClick={handleDownloadSampleProductCsv}
                        className="px-3 py-1 bg-indigo-50 text-indigo-700 hover:bg-indigo-100 font-bold rounded-lg text-xs flex items-center space-x-1 border border-indigo-200 cursor-pointer"
                      >
                        <i className="fi fi-rr-download text-xs"></i>
                        <span>Download Sample CSV Template</span>
                      </button>
                    </div>

                    <div className="border-2 border-dashed border-slate-300 hover:border-indigo-500 rounded-2xl p-6 text-center bg-slate-50/50 transition-colors relative cursor-pointer">
                      <input
                        type="file"
                        accept=".csv"
                        onChange={(e) => {
                          const file = e.target.files[0];
                          if (file) {
                            setCsvFileName(file.name);
                            const reader = new FileReader();
                            reader.onload = (evt) => {
                              setCsvFileRawText(evt.target.result);
                            };
                            reader.readAsText(file);
                          }
                        }}
                        className="absolute inset-0 opacity-0 cursor-pointer w-full h-full"
                      />
                      <div className="space-y-2">
                        <i className="fi fi-rr-file-spreadsheet text-3xl text-indigo-600 block"></i>
                        <p className="font-bold text-slate-800 text-sm">
                          {csvFileName ? `Selected File: ${csvFileName}` : 'Drag & Drop .csv file here or Click to Browse'}
                        </p>
                        <p className="text-[11px] text-slate-500">Supports standard UTF-8 encoded Product Master CSV files</p>
                      </div>
                    </div>
                  </div>

                  {/* STEP 2: CONFLICT RESOLUTION & UPDATE STRATEGY */}
                  <div className="space-y-3 pt-2 border-t border-slate-200">
                    <span className="font-extrabold text-slate-900 text-xs uppercase tracking-wider flex items-center space-x-1.5">
                      <span className="w-5 h-5 rounded-full bg-indigo-600 text-white font-black flex items-center justify-center text-[10px]">2</span>
                      <span>STEP 2: CONFLICT RESOLUTION & UPDATE STRATEGY</span>
                    </span>
                    <p className="text-[11px] text-slate-500">Select action for existing products (matched by Product Name or HSN):</p>

                    <div className="space-y-2 bg-slate-50 p-4 rounded-xl border border-slate-200">
                      <label className="flex items-start space-x-3 cursor-pointer">
                        <input
                          type="radio"
                          name="conflictStrategy"
                          checked={csvConflictStrategy === 'update'}
                          onChange={() => setCsvConflictStrategy('update')}
                          className="mt-0.5 text-indigo-600 focus:ring-indigo-500"
                        />
                        <div>
                          <span className="font-extrabold text-slate-900 text-xs block">Update existing document/master records</span>
                          <span className="text-[11px] text-slate-500 block">Overwrites matching master entries and dispatches real-time update to active draft documents</span>
                        </div>
                      </label>

                      <label className="flex items-start space-x-3 cursor-pointer">
                        <input
                          type="radio"
                          name="conflictStrategy"
                          checked={csvConflictStrategy === 'skip'}
                          onChange={() => setCsvConflictStrategy('skip')}
                          className="mt-0.5 text-indigo-600 focus:ring-indigo-500"
                        />
                        <div>
                          <span className="font-extrabold text-slate-900 text-xs block">Skip existing records</span>
                          <span className="text-[11px] text-slate-500 block">Imports only unlisted new product entries and skips matching records</span>
                        </div>
                      </label>

                      <label className="flex items-start space-x-3 cursor-pointer">
                        <input
                          type="radio"
                          name="conflictStrategy"
                          checked={csvConflictStrategy === 'variant'}
                          onChange={() => setCsvConflictStrategy('variant')}
                          className="mt-0.5 text-indigo-600 focus:ring-indigo-500"
                        />
                        <div>
                          <span className="font-extrabold text-slate-900 text-xs block">Create as new variant records</span>
                          <span className="text-[11px] text-slate-500 block">Appends imported entries as new SKU variants without overwriting</span>
                        </div>
                      </label>
                    </div>
                  </div>
                </div>

                {/* MODAL FOOTER */}
                <div className="flex items-center justify-end space-x-3 px-6 py-4 bg-slate-50 border-t border-slate-200">
                  <button
                    type="button"
                    onClick={() => setIsCsvImportModalOpen(false)}
                    className="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-xl text-xs cursor-pointer"
                  >
                    Cancel
                  </button>
                  <button
                    type="button"
                    onClick={handleExecuteCsvImport}
                    disabled={!csvFileRawText}
                    className={`px-5 py-2 text-white font-extrabold rounded-xl text-xs shadow-md transition-all ${
                      csvFileRawText
                        ? 'bg-gradient-to-r from-emerald-600 to-emerald-700 hover:from-emerald-500 hover:to-emerald-600 cursor-pointer'
                        : 'bg-slate-300 cursor-not-allowed'
                    }`}
                  >
                    Primary CTA: Import CSV
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>

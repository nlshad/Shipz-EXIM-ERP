<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ExportFlow ERP - Integrated EXIM Platform</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet">

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif'],
            mono: ['Inter', 'system-ui', '-apple-system', 'BlinkMacSystemFont', 'Segoe UI', 'Roboto', 'sans-serif']
          },
          colors: {
            indigo: { 600: '#4F46E5', 700: '#4338CA' },
            slate: { 900: '#0F172A' }
          }
        }
      }
    }
  </script>

  <!-- React 18 Production Build -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <!-- html2pdf.js for Instant A4 PDF Download -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

  <!-- SheetJS for Client-Side Excel (.xlsx) and CSV Bulk Processing -->
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- Custom Styles & Flaticon UIcons Regular -->
  <link rel="stylesheet"
    href="https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-rounded/css/uicons-regular-rounded.css">
  <link rel="stylesheet"
    href="https://cdn-uicons.flaticon.com/2.6.0/uicons-regular-straight/css/uicons-regular-straight.css">
  <link rel="stylesheet" href="./src/styles/glassmorphism.css">

  <style>
    /* High-detail sans typography for numbers, numerical values, metrics, and data tables */
    .font-mono, [class*="font-mono"], .tabular-nums, input[type="number"], .font-numeric {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif !important;
      font-feature-settings: "tnum" 1, "cv05" 1, "cv11" 1, "calt" 1 !important;
      font-variant-numeric: tabular-nums !important;
      letter-spacing: -0.015em;
    }

    @media print {
      html, body {
        background: #ffffff !important;
        color: #000000 !important;
        overflow: visible !important;
        height: auto !important;
        width: 100% !important;
        margin: 0 !important;
        padding: 0 !important;
      }

      body * {
        visibility: hidden !important;
      }

      #quotation-pdf-modal-container,
      #quotation-pdf-modal-container *,
      #proforma-pdf-modal-container,
      #proforma-pdf-modal-container * {
        visibility: visible !important;
      }

      #quotation-pdf-modal-container,
      #proforma-pdf-modal-container {
        position: absolute !important;
        left: 0 !important;
        top: 0 !important;
        width: 100% !important;
        height: auto !important;
        max-height: none !important;
        background: #ffffff !important;
        padding: 0 !important;
        margin: 0 !important;
        box-shadow: none !important;
        border: none !important;
        overflow: visible !important;
        z-index: 999999 !important;
      }

      /* Unclamp modal dialog wrapper height & overflow without affecting inner cards */
      #quotation-pdf-modal-container > div,
      #proforma-pdf-modal-container > div {
        max-height: none !important;
        height: auto !important;
        overflow: visible !important;
        border: none !important;
        box-shadow: none !important;
        background: #ffffff !important;
        padding: 0 !important;
        margin: 0 !important;
        width: 100% !important;
        max-width: 100% !important;
      }

      #quotation-pdf-modal-container div.overflow-y-auto,
      #proforma-pdf-modal-container div.overflow-y-auto {
        max-height: none !important;
        overflow: visible !important;
        padding: 0 !important;
        background: #ffffff !important;
      }

      .no-print {
        display: none !important;
      }

      #quotation-pdf-canvas,
      #proforma-pdf-canvas {
        box-shadow: none !important;
        border: none !important;
        outline: none !important;
        width: 100% !important;
        max-width: 100% !important;
        padding: 0 !important;
        margin: 0 !important;
        overflow: visible !important;
        height: auto !important;
        background: #ffffff !important;
      }

      /* Ensure tables & cards break gracefully across pages */
      table {
        page-break-inside: auto !important;
      }

      tr {
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }

      thead {
        display: table-header-group !important;
      }

      tfoot {
        display: table-footer-group !important;
      }

      .print-break-inside-avoid {
        page-break-inside: avoid !important;
        break-inside: avoid !important;
      }

      @page {
        size: A4 portrait;
        margin: 10mm;
      }
    }

    /* Responsive Viewport Optimizations for 720p & 1080p Displays */
    @media (max-width: 1536px) {
      .table-responsive-container {
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
      }
    }

    /* Custom Scrollbars */
    .scrollbar-thin::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    .scrollbar-thin::-webkit-scrollbar-track {
      background: rgba(0, 0, 0, 0.04);
    }

    .scrollbar-thin::-webkit-scrollbar-thumb {
      background: rgba(100, 116, 139, 0.3);
      border-radius: 4px;
    }

    .scrollbar-thin::-webkit-scrollbar-thumb:hover {
      background: rgba(100, 116, 139, 0.5);
    }

    /* Ultra-smooth Global Interactive Micro-Animations */
    button,
    input,
    select,
    textarea,
    a,
    .clickable-card {
      transition: background-color 0.2s ease, border-color 0.2s ease, color 0.2s ease, transform 0.15s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s ease;
    }

    button:active,
    .btn-action:active {
      transform: scale(0.96) !important;
    }

    /* Action Dropdown & Popover Fade & Slide Animations */
    @keyframes dropdownFadeIn {
      from {
        opacity: 0;
        transform: translateY(-6px) scale(0.97);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .dropdown-animate {
      animation: dropdownFadeIn 0.18s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Modal Backdrop & Content Entrance Animations */
    @keyframes modalBackdropFade {
      from {
        opacity: 0;
        backdrop-filter: blur(0px);
      }

      to {
        opacity: 1;
        backdrop-filter: blur(4px);
      }
    }

    @keyframes modalContentPop {
      from {
        opacity: 0;
        transform: scale(0.95) translateY(10px);
      }

      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    .animate-modal-backdrop {
      animation: modalBackdropFade 0.25s ease-out forwards;
    }

    .animate-modal-content {
      animation: modalContentPop 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }

    /* Smooth Delete Toast / Row Removal Feedback */
    @keyframes deleteItemShake {

      0%,
      100% {
        transform: translateX(0);
      }

      20%,
      60% {
        transform: translateX(-4px);
      }

      40%,
      80% {
        transform: translateX(4px);
      }
    }

    .btn-delete-hover:hover {
      animation: deleteItemShake 0.4s ease-in-out;
    }

    /* Ripple / Glow hover utilities */
    .hover-lift {
      transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.2s ease;
    }

    .hover-lift:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px -5px rgba(59, 130, 246, 0.15), 0 8px 10px -6px rgba(59, 130, 246, 0.1);
    }
  </style>
</head>

<body
  class="bg-[#EEF4FF] text-slate-900 font-sans antialiased h-screen overflow-hidden selection:bg-indigo-600 selection:text-white">
  <div id="root">
    <!-- Instant Loading Placeholder -->
    <div style="display: flex; height: 100vh; width: 100vw; align-items: center; justify-content: center; background-color: #F8FAFC; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
      <div style="text-align: center; display: flex; flex-direction: column; align-items: center; gap: 14px;">
        <div style="width: 44px; height: 44px; border: 3.5px solid #E2E8F0; border-top-color: #4F46E5; border-radius: 50%; animation: shipzSpin 0.7s linear infinite;"></div>
        <div style="font-size: 13px; font-weight: 800; color: #1E293B; letter-spacing: -0.02em;">ExportFlow ERP &bull; Loading Workspace...</div>
      </div>
      <style>@keyframes shipzSpin { to { transform: rotate(360deg); } }</style>
    </div>
  </div>

  <!-- Instant Precompiled Application Bundle (Loads in < 100ms) -->
  <script src="app.bundle.js?v=2.9"></script>
  <script>
    if (!window.__SHIPZ_LOADED__) {
      window.addEventListener("DOMContentLoaded", function() {
        setTimeout(function() {
          if (!window.__SHIPZ_LOADED__) {
            console.warn("Loading dynamic JSX fallback...");
            var b = document.createElement("script");
            b.src = "https://unpkg.com/@babel/standalone/babel.min.js";
            b.onload = function() {
              var a = document.createElement("script");
              a.type = "text/babel";
              a.src = "app.jsx";
              document.body.appendChild(a);
            };
            document.head.appendChild(b);
          }
        }, 600);
      });
    }
  </script>
</body>

</html>

      const generateCloudinarySignature = async (params, secret, algo = 'SHA-1') => {
        const sortedKeys = Object.keys(params).sort();
        const stringToSign = sortedKeys.map(k => `${k}=${params[k]}`).join('&') + secret;
        const encoder = new TextEncoder();
        const data = encoder.encode(stringToSign);
        const hashBuffer = await crypto.subtle.digest(algo, data);
        const hashArray = Array.from(new Uint8Array(hashBuffer));
        return hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
      };

      const convertNumberToWords = (num) => {
        if (!num || isNaN(num)) return 'ZERO USD ONLY';
        const a = ['', 'ONE ', 'TWO ', 'THREE ', 'FOUR ', 'FIVE ', 'SIX ', 'SEVEN ', 'EIGHT ', 'NINE ', 'TEN ', 'ELEVEN ', 'TWELVE ', 'THIRTEEN ', 'FOURTEEN ', 'FIFTEEN ', 'SIXTEEN ', 'SEVENTEEN ', 'EIGHTEEN ', 'NINETEEN '];
        const b = ['', '', 'TWENTY ', 'THIRTY ', 'FORTY ', 'FIFTY ', 'SIXTY ', 'SEVENTY ', 'EIGHTY ', 'NINETY '];

        const inWords = (n) => {
          n = Math.floor(n).toString();
          if (n.length > 9) return 'OVERFLOW';
          const n_array = ('000000000' + n).substr(-9).match(/^(\d{2})(\d{2})(\d{2})(\d{1})(\d{2})$/);
          if (!n_array) return '';
          let str = '';
          str += (n_array[1] != 0) ? (a[Number(n_array[1])] || b[n_array[1][0]] + ' ' + a[n_array[1][1]]) + 'CRORE ' : '';
          str += (n_array[2] != 0) ? (a[Number(n_array[2])] || b[n_array[2][0]] + ' ' + a[n_array[2][1]]) + 'LAKH ' : '';
          str += (n_array[3] != 0) ? (a[Number(n_array[3])] || b[n_array[3][0]] + ' ' + a[n_array[3][1]]) + 'THOUSAND ' : '';
          str += (n_array[4] != 0) ? (a[Number(n_array[4])] || b[n_array[4][0]] + ' ' + a[n_array[4][1]]) + 'HUNDRED ' : '';
          str += (n_array[5] != 0) ? ((str != '') ? 'AND ' : '') + (a[Number(n_array[5])] || b[n_array[5][0]] + ' ' + a[n_array[5][1]]) : '';
          return str;
        };

        const words = inWords(num).trim();
        return (words ? words : 'ZERO') + ' USD ONLY';
      };

                          </button>
                          <label className="px-2.5 py-1 bg-emerald-50 hover:bg-emerald-100 text-emerald-900 border border-emerald-200 font-bold text-[10px] rounded-md transition-colors cursor-pointer flex items-center space-x-1">
                            <i className="fi fi-rr-cloud-upload text-[10px]"></i>
                            <span>Upload Image</span>
                            <input type="file" accept="image/*" onChange={handleUploadFileToDriveAndSelect} className="hidden" />
                          </label>
                        </div>
                      </div>
                      <div className="w-5/12">
                        <label className="block text-[10px] font-bold text-slate-500 mb-0.5">Image URL / Link</label>
                        <input
                          type="text"
                          value={lineItemModalState.itemData.imgUrl || ''}
                          onChange={(e) => setLineItemModalState(prev => ({ ...prev, itemData: { ...prev.itemData, imgUrl: e.target.value } }))}
                          placeholder="https://images.unsplash.com/..."
                          className="w-full bg-slate-50 border border-slate-200 rounded px-2 py-1 text-[11px] font-mono"
                        />
                      </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div>
                        <label className="block text-slate-700 font-bold mb-1 flex justify-between">
                          <span>Product <span className="text-red-500">*</span></span>
                          <span className="text-blue-600 font-bold text-[10px] cursor-pointer hover:underline" onClick={() => setActiveQuickAdd('product')}>+ Add New Master</span>
                        </label>
                        <select value={lineItemModalState.itemData.product} onChange={(e) => handleModalProductChange(e.target.value)} className="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-xs font-semibold">
                          <option value="">-- Select Product --</option>
                          {masterProducts.map((prd) => (
                            <option key={prd.id} value={prd.name}>{prd.name}</option>
                          ))}
                        </select>
                      </div>

                      <div>
                        <label className="block text-slate-700 font-bold mb-1">Unit</label>
                        <select value={lineItemModalState.itemData.unit} onChange={(e) => setLineItemModalState(prev => ({ ...prev, itemData: { ...prev.itemData, unit: e.target.value } }))} className="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-xs font-semibold">
                          <option value="">-- Select Unit --</option>
                          <option value="Litre (Litre)">Litre (Litre)</option>
                          <option value="KG (Kilogram)">KG (Kilogram)</option>
                          <option value="MT (Metric Tonne)">MT (Metric Tonne)</option>
                          <option value="PCS (Pieces)">PCS (Pieces)</option>
                          <option value="Box">Box</option>
                          <option value="Drum">Drum</option>
                          <option value="Bag">Bag</option>
                        </select>
                      </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4 items-end">
                      <div>
                        <label className="block text-slate-700 font-bold mb-1">Quantity</label>
                        <div className="flex items-center space-x-1">
                          <button type="button" onClick={() => setLineItemModalState(prev => ({ ...prev, itemData: { ...prev.itemData, quantity: Math.max(1, (parseFloat(prev.itemData.quantity) || 1) - 1) } }))} className="w-8 h-8 bg-slate-200 hover:bg-slate-300 text-slate-800 rounded font-bold text-sm shrink-0">-</button>
                          <input type="number" value={lineItemModalState.itemData.quantity} onChange={(e) => setLineItemModalState(prev => ({ ...prev, itemData: { ...prev.itemData, quantity: parseFloat(e.target.value) || 0 } }))} className="w-full text-center bg-white border border-slate-300 rounded py-1.5 text-xs font-bold" />
                          <button type="button" onClick={() => setLineItemModalState(prev => ({ ...prev, itemData: { ...prev.itemData, quantity: (parseFloat(prev.itemData.quantity) || 0) + 1 } }))} className="w-8 h-8 bg-blue-600 hover:bg-blue-700 text-white rounded font-bold text-sm shrink-0">+</button>
                        </div>
                      </div>

                      <div>
                        <label className="block text-slate-700 font-bold mb-1">Price (USD)</label>
                        <input type="number" step="0.01" value={lineItemModalState.itemData.price} onChange={(e) => setLineItemModalState(prev => ({ ...prev, itemData: { ...prev.itemData, price: parseFloat(e.target.value) || 0 } }))} className="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-xs font-mono font-bold" />
                      </div>

                      <div>
                        <label className="block text-slate-700 font-bold mb-1 flex items-center justify-between">
                          <span>Total (USD)</span>
                          <span className="text-[9px] bg-emerald-100 text-emerald-800 px-1 rounded font-mono font-bold">Auto</span>
                        </label>
                        <input type="text" readOnly value={`$ ${((parseFloat(lineItemModalState.itemData.quantity) || 0) * (parseFloat(lineItemModalState.itemData.price) || 0)).toFixed(2)}`} className="w-full bg-emerald-50/80 border border-emerald-200 rounded-lg px-3 py-2 text-xs font-mono font-bold text-emerald-900" />
                      </div>
                    </div>

                    <div>
                      <label className="block text-slate-700 font-bold mb-1">Product Description (Auto-filled from Master)</label>
                      <textarea rows={2} value={lineItemModalState.itemData.productDescription} onChange={(e) => setLineItemModalState(prev => ({ ...prev, itemData: { ...prev.itemData, productDescription: e.target.value } }))} placeholder="Product specification / details..." className="w-full bg-white border border-slate-300 rounded-lg p-2.5 text-xs"></textarea>
                    </div>
                  </div>

                  {/* CARD 2: WEIGHTS & PACKAGING SPECIFICATIONS */}
                  <div className="p-4 rounded-xl border border-slate-200 bg-slate-50/50 space-y-4">
                    <h4 className="font-black text-slate-900 text-xs border-b border-slate-200 pb-2 flex items-center space-x-1.5 text-indigo-900">
                      <i className="fi fi-rr-box-alt text-xs"></i>
                      <span>Weights, Packaging & Material</span>
                    </h4>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                      <div>
                        <label className="block text-slate-700 font-bold mb-1">Net Weight (KG)</label>
                        <input type="text" value={lineItemModalState.itemData.netWeight} onChange={(e) => setLineItemModalState(prev => ({ ...prev, itemData: { ...prev.itemData, netWeight: e.target.value } }))} placeholder="e.g. 1000.00" className="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-xs font-mono font-bold" />
                      </div>

                      <div>
                        <label className="block text-slate-700 font-bold mb-1">Gross Weight (KG)</label>
                        <input type="text" value={lineItemModalState.itemData.grossWeight} onChange={(e) => setLineItemModalState(prev => ({ ...prev, itemData: { ...prev.itemData, grossWeight: e.target.value } }))} placeholder="e.g. 1050.00" className="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-xs font-mono font-bold" />
                      </div>

                      <div>
                        <label className="block text-slate-700 font-bold mb-1">Package Capacity</label>
                        <input type="text" value={lineItemModalState.itemData.packageText} onChange={(e) => setLineItemModalState(prev => ({ ...prev, itemData: { ...prev.itemData, packageText: e.target.value } }))} placeholder="e.g. 25 KG Bag" className="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-xs font-medium" />
                      </div>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                      <div>
                        <label className="block text-slate-700 font-bold mb-1">Package Type</label>
                        <select value={lineItemModalState.itemData.packageType} onChange={(e) => setLineItemModalState(prev => ({ ...prev, itemData: { ...prev.itemData, packageType: e.target.value } }))} className="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-xs font-semibold">
                          <option value="">-- Select Package Type --</option>
                          <option value="MS Drum">MS Drum</option>
                          <option value="HDPE Bags">HDPE Bags</option>
                          <option value="Wooden Pallet">Wooden Pallet</option>
                          <option value="Carton Box">Carton Box</option>
                        </select>
                      </div>

                      <div>
                        <label className="block text-slate-700 font-bold mb-1">Material</label>
                        <select value={lineItemModalState.itemData.material} onChange={(e) => setLineItemModalState(prev => ({ ...prev, itemData: { ...prev.itemData, material: e.target.value } }))} className="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-xs font-semibold">
                          <option value="">-- Select Material --</option>
                          {masterMaterials.map((mat, i) => (
                            <option key={i} value={mat}>{mat}</option>
                          ))}
                        </select>
                      </div>

                      <div>
                        <label className="block text-slate-700 font-bold mb-1">Quality Spec</label>
                        <select value={lineItemModalState.itemData.qualitySpec} onChange={(e) => setLineItemModalState(prev => ({ ...prev, itemData: { ...prev.itemData, qualitySpec: e.target.value } }))} className="w-full bg-white border border-slate-300 rounded-lg px-3 py-2 text-xs font-semibold">
                          <option value="">-- Select Quality Spec --</option>
                          <option value="Standard Export Grade">Standard Export Grade</option>
                          <option value="Premium Grade">Premium Grade</option>
                          <option value="Industrial Grade">Industrial Grade</option>
                          <option value="Pharma Grade">Pharma Grade</option>
                        </select>
                      </div>
                    </div>
                  </div>
                </div>

                {/* SUB-MODAL FOOTER */}
                <div className="flex items-center justify-end space-x-3 px-6 py-3.5 bg-slate-50 border-t border-slate-200">
                  <button type="button" onClick={() => setLineItemModalState(prev => ({ ...prev, isOpen: false }))} className="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold text-xs rounded-lg transition-colors">
                    Cancel
                  </button>
                  <button type="button" onClick={handleSaveLineItemFromModal} className="px-5 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs rounded-lg shadow-sm transition-all flex items-center space-x-1.5">
                    <i className="fi fi-rr-disk text-xs"></i>
                    <span>Save Line Item</span>
                  </button>
                </div>

              </div>
            </div>
          )}

          {/* GLOBAL ROOT QUICK-ADD MODAL OVERLAY (ABSOLUTE TOP Z-INDEX Z-[100]) */}
          {activeQuickAdd && (
            <div className="fixed inset-0 bg-slate-900/80 backdrop-blur-xs flex items-center justify-center z-[100] p-4 animate-fadeIn">
              <div className="bg-white rounded-xl shadow-2xl border border-slate-200 w-full max-w-md p-5 space-y-4 relative z-[101]">
                <div className="flex justify-between items-center border-b pb-2">
                  <h4 className="font-black text-slate-900 text-sm">
                    + Add New {activeQuickAdd.charAt(0).toUpperCase() + activeQuickAdd.slice(1)} to Master
                  </h4>
                  <button type="button" onClick={() => setActiveQuickAdd(null)} className="text-slate-400 hover:text-slate-700 font-bold">✕</button>
                </div>

                {activeQuickAdd === 'product' ? (
                  <div className="space-y-4 text-xs">
                    <div>
                      <label className="block text-slate-700 font-bold mb-1">Product Name *</label>
                      <input type="text" placeholder="e.g. Organic Cumin Seed" value={quickAddFields.field1} onChange={(e) => setQuickAddFields({ ...quickAddFields, field1: e.target.value })} className="w-full border border-slate-300 rounded-lg px-3 py-2 font-bold text-slate-900" />
                    </div>

                    <div className="grid grid-cols-2 gap-3">
                      <div>
                        <label className="block text-slate-700 font-bold mb-1">HSN Code *</label>
                        <input type="text" placeholder="e.g. 09093100" value={quickAddFields.field2} onChange={(e) => setQuickAddFields({ ...quickAddFields, field2: e.target.value })} className="w-full border border-slate-300 rounded-lg px-3 py-2 font-mono font-bold" />
                      </div>
                      <div>
                        <label className="block text-slate-700 font-bold mb-1">SKU Reference</label>
                        <input type="text" placeholder="e.g. SKU-CUM-100" value={quickAddFields.field3} onChange={(e) => setQuickAddFields({ ...quickAddFields, field3: e.target.value })} className="w-full border border-slate-300 rounded-lg px-3 py-2 font-mono font-bold" />
                      </div>
                    </div>

                    {/* Product Image Option */}
                    <div className="bg-slate-50 p-3.5 rounded-xl border border-slate-200 space-y-3">
                      <label className="block text-slate-800 font-extrabold text-xs flex items-center justify-between">
                        <span className="flex items-center space-x-1.5">
                          <i className="fi fi-rr-picture text-indigo-600"></i>
                          <span>Product Image & Cloudinary Sync</span>
                        </span>
                        <span className="text-[10px] text-emerald-700 bg-emerald-100 px-2 py-0.5 rounded-full font-bold">Cloudinary Integrated</span>
                      </label>

                      <div className="flex items-center space-x-3">
                        <div className="w-16 h-16 rounded-xl bg-white border border-slate-300 shadow-xs shrink-0 overflow-hidden flex items-center justify-center relative group">
                          {quickAddFields.field4 ? (
                            <img src={quickAddFields.field4} alt="Product Preview" className="w-full h-full object-cover" />
                          ) : (
                            <i className="fi fi-rr-picture text-2xl text-slate-300"></i>
                          )}
                        </div>

                        <div className="flex-1 space-y-1.5">
                          <input
                            type="text"
                            placeholder="Image URL or Cloudinary CDN link..."
                            value={quickAddFields.field4 || ''}
                            onChange={e => setQuickAddFields({ ...quickAddFields, field4: e.target.value })}
                            className="w-full border border-slate-300 rounded-lg px-3 py-1.5 text-xs font-mono font-bold"
                          />
                          <div className="flex items-center space-x-2">
                            <button
                              type="button"
                              onClick={() => { setDriveTargetContext('product_quickadd'); setIsDrivePickerOpen(true); }}
                              className="px-2.5 py-1 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-lg text-[11px] flex items-center space-x-1 shadow-xs"
                            >
                              <i className="fi fi-rr-folder text-xs"></i>
                              <span>+ Choose from ShipzyDrive</span>
                            </button>
                            <label className="px-2.5 py-1 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-lg text-[11px] flex items-center space-x-1 shadow-xs cursor-pointer">
                              <i className="fi fi-rr-cloud-upload text-xs"></i>
                              <span>Upload</span>
                              <input type="file" accept="image/*" onChange={(e) => { setDriveTargetContext('product_quickadd'); handleUploadFileToDriveAndSelect(e); }} className="hidden" />
                            </label>
                          </div>
                        </div>
                      </div>
                    </div>
                  </div>
                ) : (
                  <div className="space-y-3 text-xs">
                    <div>
                      <label className="block text-slate-700 font-bold mb-1">
                        {activeQuickAdd === 'companyAddress' ? 'Company Unit / Address Name *' : activeQuickAdd === 'consignee' ? 'Customer / Consignee Name *' : activeQuickAdd === 'port' ? 'Port Name *' : activeQuickAdd === 'bank' ? 'Bank Name *' : 'Name / Title *'}
                      </label>
                      <input type="text" placeholder={activeQuickAdd === 'bank' ? 'e.g. KOTAK MAHINDRA BANK LIMITED' : 'Enter name...'} value={quickAddFields.field1} onChange={(e) => setQuickAddFields({ ...quickAddFields, field1: e.target.value })} className="w-full border border-slate-300 rounded px-3 py-2 text-xs font-semibold" />
                    </div>

                    {(activeQuickAdd === 'companyAddress' || activeQuickAdd === 'consignee' || activeQuickAdd === 'port' || activeQuickAdd === 'bank') && (
                      <div>
                        <label className="block text-slate-700 font-bold mb-1">
                          {activeQuickAdd === 'companyAddress' ? 'Unit Type / Details' : activeQuickAdd === 'bank' ? 'Beneficiary Name' : 'Country'}
                        </label>
                        <input type="text" placeholder={activeQuickAdd === 'companyAddress' ? 'e.g. Visakhapatnam Unit' : activeQuickAdd === 'bank' ? 'e.g. GREANSCAPE SHAKTI VENTURES EXIM PVT LTD' : 'Country name...'} value={quickAddFields.field2} onChange={(e) => setQuickAddFields({ ...quickAddFields, field2: e.target.value })} className="w-full border border-slate-300 rounded px-3 py-2 text-xs" />
                      </div>
                    )}

                    {(activeQuickAdd === 'consignee' || activeQuickAdd === 'bank') && (
                      <div>
                        <label className="block text-slate-700 font-bold mb-1">{activeQuickAdd === 'bank' ? 'Bank Account Number *' : 'Primary Address'}</label>
                        <input type="text" placeholder={activeQuickAdd === 'bank' ? 'e.g. 6748421381' : 'City, Country address...'} value={quickAddFields.field3} onChange={(e) => setQuickAddFields({ ...quickAddFields, field3: e.target.value })} className="w-full border border-slate-300 rounded px-3 py-2 text-xs font-semibold" />
                      </div>
                    )}
                  </div>
                )}

                <div className="flex justify-end space-x-2 pt-2 border-t">
                  <button type="button" onClick={() => setActiveQuickAdd(null)} className="px-4 py-2 bg-slate-200 hover:bg-slate-300 font-bold rounded text-slate-700">Cancel</button>
                  <button type="button" onClick={handleSaveQuickAdd} className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded">Save to Master & Select</button>
                </div>
              </div>
            </div>
          )}

          {/* SHIPZY DRIVE IMAGE PICKER MODAL (TOP Z-INDEX Z-[110]) */}
          {isDrivePickerOpen && (
            <div className="fixed inset-0 bg-slate-900/85 backdrop-blur-xs flex items-center justify-center z-[110] p-4 animate-fadeIn">
              <div className="bg-white rounded-2xl shadow-2xl border border-slate-200 w-full max-w-4xl max-h-[85vh] flex flex-col relative z-[111] overflow-hidden">
                {/* MODAL HEADER */}
                <div className="flex items-center justify-between px-6 py-4 border-b border-slate-200 bg-slate-900 text-white">
                  <div className="flex items-center space-x-3">
                    <div className="w-9 h-9 rounded-xl bg-amber-500/20 text-amber-400 border border-amber-500/30 flex items-center justify-center font-bold">
                      <i className="fi fi-rr-folder text-base"></i>
                    </div>
                    <div>
                      <h3 className="text-base font-black tracking-tight text-white flex items-center space-x-2">
                        <span>ShipzyDrive Asset Repository</span>
                        <span className="text-[10px] px-2 py-0.5 rounded-full bg-amber-500/20 text-amber-300 font-bold border border-amber-500/30">Media Vault</span>
                      </h3>
                      <p className="text-[11px] text-slate-400">Select an existing image from Drive or upload a new product photo</p>
                    </div>
                  </div>
                  <button type="button" onClick={() => setIsDrivePickerOpen(false)} className="text-slate-400 hover:text-white text-xl font-bold p-1">✕</button>
                </div>

                {/* MODAL SUB-HEADER / ACTIONS */}
                <div className="flex items-center justify-between px-6 py-3 bg-slate-50 border-b border-slate-200 text-xs">
                  <div className="flex items-center space-x-2">
                    <span className="font-bold text-slate-700">Filter Category:</span>
                    <span className="px-2.5 py-1 bg-amber-100 text-amber-900 font-bold rounded-lg border border-amber-200">Product Photos ({driveAssets.length})</span>
                  </div>

                  {/* UPLOAD TO DRIVE BUTTON */}
                  <label className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-sm text-xs cursor-pointer flex items-center space-x-2 transition-all">
                    <i className="fi fi-rr-cloud-upload text-sm"></i>
                    <span>+ Upload New Image to Drive</span>
                    <input type="file" accept="image/*" onChange={handleUploadFileToDriveAndSelect} className="hidden" />
                  </label>
                </div>

                {/* IMAGE GRID CONTAINER */}
                <div className="p-6 overflow-y-auto max-h-[60vh] space-y-4">
                  <div className="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4">
                    {driveAssets.map((asset) => (
                      <div
                        key={asset.id}
                        onClick={() => handleSelectDriveAsset(asset.url)}
                        className="group relative bg-white border border-slate-200 hover:border-amber-500 rounded-xl overflow-hidden shadow-xs hover:shadow-md transition-all cursor-pointer flex flex-col"
                      >
                        <div className="aspect-square bg-slate-100 overflow-hidden relative">
                          <img
                            src={asset.url}
                            alt={asset.title}
                            className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-300"
                            onError={(e) => { e.target.onerror = null; e.target.src = 'https://images.unsplash.com/photo-1584308666744-24d5c474f2ae?w=300&auto=format&fit=crop&q=80'; }}
                          />
                          <div className="absolute inset-0 bg-slate-900/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                            <span className="px-3 py-1.5 bg-amber-500 text-white text-xs font-bold rounded-lg shadow-md flex items-center space-x-1">
                              <i className="fi fi-rr-check text-xs"></i>
                              <span>Select Image</span>
                            </span>
                          </div>
                        </div>

                        <div className="p-3 bg-white space-y-1">
                          <h4 className="font-bold text-slate-900 text-xs truncate group-hover:text-amber-600 transition-colors">{asset.title}</h4>
                          <div className="flex justify-between items-center text-[10px] text-slate-500">
                            <span className="truncate font-mono">{asset.fileName}</span>
                            <span className="font-bold text-slate-600 shrink-0">{asset.fileSizeMb} MB</span>
                          </div>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>

                {/* MODAL FOOTER */}
                <div className="flex justify-between items-center px-6 py-3.5 bg-slate-50 border-t border-slate-200 text-xs">
                  <span className="text-slate-500 font-medium">Tip: Uploaded files are automatically organized under your ShipzyDrive media vault.</span>
                  <button type="button" onClick={() => setIsDrivePickerOpen(false)} className="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-800 font-bold rounded-lg transition-colors">
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>

</html>
